name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Lint, format and type-check
        run: npm run check

      - name: Unit tests
        run: npm test

      # Seeds data/raw from the committed fixtures, then db:build + db:test + publish (§13).
      # 090 (ladder vs Squiggle) is skipped: the fixtures hold a partial season.
      - name: Build web with fixture data
        run: |
          npm run fixtures:seed -- --raw data/raw
          npm run rebuild
          npm run build

      - name: Install Playwright Chromium
        run: npx -w apps/web playwright install --with-deps chromium

      - name: E2E
        run: npm run e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
